      - name: Build and restart
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /var/www/fang-reader-app

            rm -rf node_modules
            npm install
            npm run build

            # standalone output needs these next to server.js (harmless with "next start")
            cp -r public .next/standalone/public
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/static

            pm2 restart fang-reader-app --update-env || pm2 start npm --name "fang-reader-app" -- start

            pm2 save
          EOF